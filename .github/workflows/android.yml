name: android

on:
  push:
    branches:
      - allthecodes
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
        include:
          - target: aarch64-linux-android
            artifact_name: android-arm64
            cc_target: aarch64-linux-android21
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-v2-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          cache-targets: true

      - name: Set up NDK cross-compilation environment
        shell: bash
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN_DIR="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          CC_TARGET="${{ matrix.cc_target }}"

          echo "${TOOLCHAIN_DIR}/bin" >> "$GITHUB_PATH"

          echo "CC=${TOOLCHAIN_DIR}/bin/${CC_TARGET}-clang" >> "$GITHUB_ENV"
          echo "CXX=${TOOLCHAIN_DIR}/bin/${CC_TARGET}-clang++" >> "$GITHUB_ENV"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN_DIR}/bin/${CC_TARGET}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=${TOOLCHAIN_DIR}/bin/llvm-ar" >> "$GITHUB_ENV"

          cd "${TOOLCHAIN_DIR}/bin"
          for tool in aarch64-linux-android21-clang aarch64-linux-android21-clang++; do
            base_name="${tool%%21*}"
            if [ ! -f "${base_name}clang" ] && [ -f "$tool" ]; then
              ln -sf "$tool" "${base_name}clang"
            fi
            if [ ! -f "${base_name}clang++" ] && [ -f "${tool}++" ]; then
              ln -sf "${tool}++" "${base_name}clang++"
            fi
          done

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcap-dev

      - name: Build for Android
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --bin allthecodes

      - name: Strip binary
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          ${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            "target/${{ matrix.target }}/release/allthecodes"

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/allthecodes" \
            "dist/allthecodes-${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
